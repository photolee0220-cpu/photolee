# 실제 서버 점검: 웹사이트 → 관리자 로그인 → 데이터 읽기 → 서버 기능 → 사진 저장소
# 결과는 gh-pages 브랜치의 _ops/verify.json (비밀값·회사 데이터 없음)
name: verify-live
on:
  push:
    branches: [claude/pouch-design-handdrawn-CSzwC]
    paths: [report-system/supabase/verify-request.txt]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SETUP_KEY: ${{ secrets.SETUP_KEY }}
      SITE: https://photolee0220-cpu.github.io/photolee
    steps:
      - uses: actions/checkout@v4
      - name: Checks
        run: |
          set +e
          echo '[]' > "$RUNNER_TEMP/r.json"
          rec() { jq --arg c "$1" --arg ok "$2" --arg d "$3" '. + [{check:$c, ok:($ok=="1"), detail:$d}]' "$RUNNER_TEMP/r.json" > "$RUNNER_TEMP/t" && mv "$RUNNER_TEMP/t" "$RUNNER_TEMP/r.json"; }
          for i in $(seq 1 20); do cfg=$(curl -sS "$SITE/config.js?$(date +%s)"); echo "$cfg" | grep -q supabase.co && break; sleep 15; done
          URL=$(echo "$cfg" | grep -o "https://[a-z0-9]*\.supabase\.co")
          ANON=$(echo "$cfg" | grep -o "supabaseAnonKey: '[^']*'" | sed "s/supabaseAnonKey: '//;s/'//")
          echo "::add-mask::$ANON"
          [ -n "$URL" ] && [ -n "$ANON" ] && rec "웹사이트 연결 정보" 1 "$URL" || rec "웹사이트 연결 정보" 0 "config.js에 서버 정보 없음"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/")
          [ "$code" = 200 ] && rec "웹사이트 열림" 1 "HTTP $code" || rec "웹사이트 열림" 0 "HTTP $code"
          PW=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in report-system/supabase/smoke.enc -pass env:SETUP_KEY)
          echo "::add-mask::$PW"
          tok=$(curl -sS "$URL/auth/v1/token?grant_type=password" -H "apikey: $ANON" -H "Content-Type: application/json" \
            -d "$(jq -n --arg p "$PW" '{email:"admin@sadakdari-report.app", password:$p}')")
          AT=$(echo "$tok" | jq -r '.access_token // empty')
          echo "::add-mask::$AT"
          [ -n "$AT" ] && rec "관리자 로그인" 1 "ok" || rec "관리자 로그인" 0 "$(echo "$tok" | jq -c '{code,error_code,msg}' 2>/dev/null | head -c 200)"
          H=(-H "apikey: $ANON" -H "Authorization: Bearer $AT")
          n=$(curl -sS "$URL/rest/v1/members?select=id" "${H[@]}" | jq 'length')
          [ "$n" = 16 ] && rec "인원 목록" 1 "$n명" || rec "인원 목록" 0 "$n"
          n=$(curl -sS "$URL/rest/v1/entries?select=id" "${H[@]}" | jq 'length')
          [ "$n" = 41 ] && rec "10/26 보고" 1 "$n칸" || rec "10/26 보고" 0 "$n"
          n=$(curl -sS "$URL/rest/v1/sites?select=id" "${H[@]}" | jq 'length')
          [ "$n" = 22 ] && rec "현장" 1 "$n곳" || rec "현장" 0 "$n"
          a=$(curl -sS "$URL/rest/v1/members?select=id" -H "apikey: $ANON" | jq 'length')
          [ "$a" = 0 ] && rec "로그인 안 한 사람 차단" 1 "0건" || rec "로그인 안 한 사람 차단" 0 "$a"
          w=$(curl -sS -X POST "$URL/rest/v1/rpc/week_summaries" "${H[@]}" -H "Content-Type: application/json" -d '{}' | jq -c '[.[].week_id]')
          echo "$w" | grep -q 2026-10-26 && rec "주차 목록" 1 "$w" || rec "주차 목록" 0 "$w"
          f=$(curl -sS -X POST "$URL/functions/v1/admin-users" "${H[@]}" -H "Content-Type: application/json" -d '{"action":"ping"}')
          echo "$f" | grep -q "알 수 없는 요청" && rec "서버 기능: 계정 관리" 1 "관리자 확인 통과" || rec "서버 기능: 계정 관리" 0 "$(echo "$f" | head -c 200)"
          f=$(curl -sS -X POST "$URL/functions/v1/weekly-summary" "${H[@]}" -H "Content-Type: application/json" -d '{}')
          echo "$f" | grep -q "대표님만" && rec "서버 기능: AI 요약" 1 "응답 정상(관리자는 대표 전용이라 거절)" || rec "서버 기능: AI 요약" 0 "$(echo "$f" | head -c 200)"
          dept=$(curl -sS "$URL/rest/v1/departments?select=id&limit=1" "${H[@]}" | jq -r '.[0].id')
          printf '\xff\xd8\xff\xe0\x00\x10JFIF\x00\x01\x01\x00\x00\x01\x00\x01\x00\x00\xff\xd9' > "$RUNNER_TEMP/t.jpg"
          up=$(curl -sS -X POST "$URL/storage/v1/object/site-photos/$dept/2026-11-02/verify-test.jpg" "${H[@]}" -H "Content-Type: image/jpeg" --data-binary @"$RUNNER_TEMP/t.jpg")
          echo "$up" | jq -e '.Key // .key // .Id // .id' >/dev/null && rec "사진 저장소 올리기" 1 "ok" || rec "사진 저장소 올리기" 0 "$(echo "$up" | head -c 200)"
          del=$(curl -sS -X DELETE "$URL/storage/v1/object/site-photos" "${H[@]}" -H "Content-Type: application/json" -d "$(jq -n --arg p "$dept/2026-11-02/verify-test.jpg" '{prefixes:[$p]}')")
          echo "$del" | jq -e 'length == 1' >/dev/null && rec "사진 저장소 지우기" 1 "ok" || rec "사진 저장소 지우기" 0 "$(echo "$del" | head -c 200)"
          cat "$RUNNER_TEMP/r.json"
      - name: Publish result
        if: always()
        run: |
          git fetch origin gh-pages && git worktree add "$RUNNER_TEMP/site" origin/gh-pages
          mkdir -p "$RUNNER_TEMP/site/_ops"
          jq --arg at "$(date -u +%FT%TZ)" '{at:$at, checks:.}' "$RUNNER_TEMP/r.json" > "$RUNNER_TEMP/site/_ops/verify.json"
          cd "$RUNNER_TEMP/site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "verify: live checks" && git push origin HEAD:gh-pages || true
