# 실제 서버 점검: 웹사이트 → 관리자 로그인 → 데이터 읽기 → 서버 기능 → 사진 저장소
# 결과는 gh-pages 브랜치의 _ops/verify.json (비밀값·회사 데이터 없음)
name: verify-live
on:
  push:
    branches: [claude/pouch-design-handdrawn-CSzwC]
    paths: [report-system/supabase/verify-request.txt]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SITE: https://photolee0220-cpu.github.io/photolee
    steps:
      - uses: actions/checkout@v4
      - name: Checks
        run: |
          set +e
          echo '[]' > "$RUNNER_TEMP/r.json"
          rec() { jq --arg c "$1" --arg ok "$2" --arg d "$3" '. + [{check:$c, ok:($ok=="1"), detail:$d}]' "$RUNNER_TEMP/r.json" > "$RUNNER_TEMP/t" && mv "$RUNNER_TEMP/t" "$RUNNER_TEMP/r.json"; }
          for i in $(seq 1 20); do cfg=$(curl -sS "$SITE/config.js?$(date +%s)"); echo "$cfg" | grep -q supabase.co && break; sleep 15; done
          URL=$(echo "$cfg" | grep -o "https://[a-z0-9]*\.supabase\.co")
          ANON=$(echo "$cfg" | grep -o "supabaseAnonKey: '[^']*'" | sed "s/supabaseAnonKey: '//;s/'//")
          echo "::add-mask::$ANON"
          [ -n "$URL" ] && [ -n "$ANON" ] && rec "웹사이트 연결 정보" 1 "$URL" || rec "웹사이트 연결 정보" 0 "config.js에 서버 정보 없음"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/")
          [ "$code" = 200 ] && rec "웹사이트 열림" 1 "HTTP $code" || rec "웹사이트 열림" 0 "HTTP $code"
          # 비밀번호 없이 관리자 일회용 로그인: 서버 관리 키로 로그인 코드를 만들어 바로 사용한다 (비밀번호는 바뀌지 않음)
          REF=$(echo "$URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')
          SRV=$(curl -sS "https://api.supabase.com/v1/projects/$REF/api-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[] | select(.name == "service_role") | .api_key')
          echo "::add-mask::$SRV"
          link=$(curl -sS -X POST "$URL/auth/v1/admin/generate_link" -H "apikey: $SRV" -H "Authorization: Bearer $SRV" -H "Content-Type: application/json" \
            -d '{"type":"magiclink","email":"admin@sadakdari-report.app"}')
          TH=$(echo "$link" | jq -r '.hashed_token // .properties.hashed_token // empty')
          echo "::add-mask::$TH"
          tok=$(curl -sS -X POST "$URL/auth/v1/verify" -H "apikey: $ANON" -H "Content-Type: application/json" -d "$(jq -n --arg t "$TH" '{type:"magiclink", token_hash:$t}')")
          AT=$(echo "$tok" | jq -r '.access_token // empty')
          echo "::add-mask::$AT"
          [ -n "$AT" ] && rec "관리자 로그인" 1 "ok" || rec "관리자 로그인" 0 "link=$(echo "$link" | jq -c '{code,error_code,msg}' 2>/dev/null | head -c 120) verify=$(echo "$tok" | jq -c '{code,error_code,msg}' 2>/dev/null | head -c 120)"
          H=(-H "apikey: $ANON" -H "Authorization: Bearer $AT")
          n=$(curl -sS "$URL/rest/v1/members?select=id" "${H[@]}" | jq 'length')
          [ "$n" -ge 16 ] && rec "인원 목록" 1 "$n명" || rec "인원 목록" 0 "$n"
          n=$(curl -sS "$URL/rest/v1/entries?select=id" "${H[@]}" | jq 'length')
          [ "$n" -ge 41 ] && rec "보고 칸" 1 "$n칸" || rec "보고 칸" 0 "$n"
          n=$(curl -sS "$URL/rest/v1/sites?select=id" "${H[@]}" | jq 'length')
          [ "$n" -ge 22 ] && rec "현장" 1 "$n곳" || rec "현장" 0 "$n"
          a=$(curl -sS "$URL/rest/v1/members?select=id" -H "apikey: $ANON" | jq 'length')
          [ "$a" = 0 ] && rec "로그인 안 한 사람 차단" 1 "0건" || rec "로그인 안 한 사람 차단" 0 "$a"
          w=$(curl -sS -X POST "$URL/rest/v1/rpc/week_summaries" "${H[@]}" -H "Content-Type: application/json" -d '{}' | jq -c '[.[].week_id]')
          echo "$w" | grep -q 2026-10-26 && rec "주차 목록" 1 "$w" || rec "주차 목록" 0 "$w"
          f=$(curl -sS -X POST "$URL/functions/v1/admin-users" "${H[@]}" -H "Content-Type: application/json" -d '{"action":"ping"}')
          echo "$f" | grep -q "알 수 없는 요청" && rec "서버 기능: 계정 관리" 1 "관리자 확인 통과" || rec "서버 기능: 계정 관리" 0 "$(echo "$f" | head -c 200)"
          f=$(curl -sS -X POST "$URL/functions/v1/weekly-summary" "${H[@]}" -H "Content-Type: application/json" -d '{}')
          echo "$f" | grep -q "대표님만" && rec "서버 기능: AI 요약" 1 "응답 정상(관리자는 대표 전용이라 거절)" || rec "서버 기능: AI 요약" 0 "$(echo "$f" | head -c 200)"
          dept=$(curl -sS "$URL/rest/v1/departments?select=id&limit=1" "${H[@]}" | jq -r '.[0].id')
          printf '\xff\xd8\xff\xe0\x00\x10JFIF\x00\x01\x01\x00\x00\x01\x00\x01\x00\x00\xff\xd9' > "$RUNNER_TEMP/t.jpg"
          up=$(curl -sS -X POST "$URL/storage/v1/object/site-photos/$dept/2026-11-02/verify-test.jpg" "${H[@]}" -H "Content-Type: image/jpeg" --data-binary @"$RUNNER_TEMP/t.jpg")
          echo "$up" | jq -e '.Key // .key // .Id // .id' >/dev/null && rec "사진 저장소 올리기" 1 "ok" || rec "사진 저장소 올리기" 0 "$(echo "$up" | head -c 200)"
          del=$(curl -sS -X DELETE "$URL/storage/v1/object/site-photos" "${H[@]}" -H "Content-Type: application/json" -d "$(jq -n --arg p "$dept/2026-11-02/verify-test.jpg" '{prefixes:[$p]}')")
          echo "$del" | jq -e 'length == 1' >/dev/null && rec "사진 저장소 지우기" 1 "ok" || rec "사진 저장소 지우기" 0 "$(echo "$del" | head -c 200)"
          # 첨부파일: 올리기 → 기록 → 내려받기 → 지우기, 20MB 초과 거절, 사용량
          curl -sS -X POST "$URL/rest/v1/rpc/ensure_week" "${H[@]}" -H "Content-Type: application/json" -d '{"p_week":"2026-11-02"}' >/dev/null
          FP="$dept/2026-11-02/verify-test.pdf"
          printf '%%PDF-1.4\n%% verify test\n%%%%EOF\n' > "$RUNNER_TEMP/t.pdf"
          up=$(curl -sS -X POST "$URL/storage/v1/object/report-files/$FP" "${H[@]}" -H "Content-Type: application/pdf" --data-binary @"$RUNNER_TEMP/t.pdf")
          echo "$up" | jq -e '.Key // .key // .Id // .id' >/dev/null && rec "첨부파일 올리기" 1 "ok" || rec "첨부파일 올리기" 0 "$(echo "$up" | head -c 200)"
          row=$(curl -sS -X POST "$URL/rest/v1/attachments" "${H[@]}" -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d "$(jq -n --arg d "$dept" --arg p "$FP" '{week_id:"2026-11-02", kind:"misc", department_id:$d, storage_path:$p, file_name:"점검용.pdf", size_bytes:30, mime_type:"application/pdf"}')")
          AID=$(echo "$row" | jq -r '.[0].id // empty')
          [ -n "$AID" ] && rec "첨부파일 기록" 1 "ok" || rec "첨부파일 기록" 0 "$(echo "$row" | head -c 200)"
          a=$(curl -sS "$URL/rest/v1/attachments?select=id" -H "apikey: $ANON" | jq 'length')
          [ "$a" = 0 ] && rec "첨부파일: 로그인 안 한 사람 차단" 1 "0건" || rec "첨부파일: 로그인 안 한 사람 차단" 0 "$a"
          sig=$(curl -sS -X POST "$URL/storage/v1/object/sign/report-files/$FP" "${H[@]}" -H "Content-Type: application/json" -d '{"expiresIn":60}' | jq -r '.signedURL // empty')
          curl -sS "$URL/storage/v1$sig" -o "$RUNNER_TEMP/back.pdf"
          cmp -s "$RUNNER_TEMP/t.pdf" "$RUNNER_TEMP/back.pdf" && rec "첨부파일 내려받기" 1 "내용 일치" || rec "첨부파일 내려받기" 0 "sig=${sig:0:20} $(head -c 120 "$RUNNER_TEMP/back.pdf")"
          head -c 21500000 /dev/zero > "$RUNNER_TEMP/big.pdf"
          big=$(curl -sS -o "$RUNNER_TEMP/big.out" -w "%{http_code}" -X POST "$URL/storage/v1/object/report-files/$dept/2026-11-02/verify-big.pdf" "${H[@]}" -H "Content-Type: application/pdf" --data-binary @"$RUNNER_TEMP/big.pdf")
          [ "$big" -ge 400 ] && rec "20MB 넘는 파일 거절" 1 "HTTP $big" || { rec "20MB 넘는 파일 거절" 0 "HTTP $big"; curl -sS -X DELETE "$URL/storage/v1/object/report-files" "${H[@]}" -H "Content-Type: application/json" -d "$(jq -n --arg p "$dept/2026-11-02/verify-big.pdf" '{prefixes:[$p]}')" >/dev/null; }
          u=$(curl -sS -X POST "$URL/rest/v1/rpc/storage_usage" "${H[@]}" -H "Content-Type: application/json" -d '{}')
          echo "$u" | jq -e 'type == "array"' >/dev/null && rec "저장 공간 사용량" 1 "$(echo "$u" | jq -c 'map({(.bucket_id): .bytes}) | add // {}')" || rec "저장 공간 사용량" 0 "$(echo "$u" | head -c 200)"
          [ -n "$AID" ] && curl -sS -X DELETE "$URL/rest/v1/attachments?id=eq.$AID" "${H[@]}" >/dev/null
          del=$(curl -sS -X DELETE "$URL/storage/v1/object/report-files" "${H[@]}" -H "Content-Type: application/json" -d "$(jq -n --arg p "$FP" '{prefixes:[$p]}')")
          left=$(curl -sS "$URL/rest/v1/attachments?select=id&week_id=eq.2026-11-02&file_name=eq.%EC%A0%90%EA%B2%80%EC%9A%A9.pdf" "${H[@]}" | jq 'length')
          echo "$del" | jq -e 'length == 1' >/dev/null && [ "$left" = 0 ] && rec "첨부파일 지우기(점검 흔적 정리)" 1 "ok" || rec "첨부파일 지우기(점검 흔적 정리)" 0 "$(echo "$del" | head -c 150) left=$left"
          # 0005: 단계, 기타사항 통합, 현장 작성 여부
          st=$(curl -sS "$URL/rest/v1/stages?select=short&order=sort" "${H[@]}")
          echo "$st" | jq -e 'length >= 3' >/dev/null && rec "현장 단계 목록" 1 "$(echo "$st" | jq -c 'map(.short)')" || rec "현장 단계 목록" 0 "$(echo "$st" | head -c 200)"
          m=$(curl -sS "$URL/rest/v1/entries?select=id&kind=eq.misc" "${H[@]}" | jq 'length')
          [ "$m" = 0 ] && rec "기타사항 → 부서 업무보고로 이동" 1 "남은 기타사항 0건" || rec "기타사항 → 부서 업무보고로 이동" 0 "$m건 남음"
          f=$(curl -sS "$URL/rest/v1/entries?select=id&kind=eq.dept&content=like.*%E2%96%A0%20%EA%B8%B0%ED%83%80%EC%82%AC%ED%95%AD*" "${H[@]}" | jq 'length')
          rec "옮겨진 기타사항" 1 "부서 업무보고 ${f}건에 '■ 기타사항'"
          ss=$(curl -sS -X POST "$URL/rest/v1/rpc/site_report_status" "${H[@]}" -H "Content-Type: application/json" -d '{"p_week":"2026-10-26"}')
          echo "$ss" | jq -e 'type == "array" and length > 0' >/dev/null && rec "현장 작성 여부(내용 없이)" 1 "$(echo "$ss" | jq 'length')칸, 내용 필드 없음: $(echo "$ss" | jq '.[0] | has("content") | not')" || rec "현장 작성 여부(내용 없이)" 0 "$(echo "$ss" | head -c 200)"
          a=$(curl -sS -X POST "$URL/rest/v1/rpc/site_report_status" -H "apikey: $ANON" -H "Content-Type: application/json" -d '{"p_week":"2026-10-26"}')
          echo "$a" | jq -e 'type == "array"' >/dev/null && rec "작성 여부: 로그인 안 한 사람 차단" 0 "$(echo "$a" | head -c 120)" || rec "작성 여부: 로그인 안 한 사람 차단" 1 "거절됨"
          sid="st_verify_$(date +%s)"
          ins=$(curl -sS -X POST "$URL/rest/v1/stages" "${H[@]}" -H "Content-Type: application/json" -H "Prefer: return=representation" -d "{\"id\":\"$sid\",\"label\":\"점검용\",\"short\":\"점검용\",\"sort\":99}")
          del=$(curl -sS -X DELETE "$URL/rest/v1/stages?id=eq.$sid" "${H[@]}" -H "Prefer: return=representation")
          echo "$ins" | jq -e 'length == 1' >/dev/null && echo "$del" | jq -e 'length == 1' >/dev/null && rec "관리자: 단계 추가·삭제" 1 "ok (점검용 단계 지움)" || rec "관리자: 단계 추가·삭제" 0 "ins=$(echo "$ins" | head -c 100) del=$(echo "$del" | head -c 100)"
          # 0006: 관리자 현장 삭제 (점검용 현장을 만들고 바로 지운다)
          site=$(curl -sS -X POST "$URL/rest/v1/sites" "${H[@]}" -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d '{"name":"점검용 임시 현장","note":"","stage":"sales","due_text":"미정","process":"","scale":"","tags":[],"sort":9999,"archived":true}')
          TSID=$(echo "$site" | jq -r '.[0].id // empty')
          dr=$(curl -sS -X POST "$URL/rest/v1/rpc/delete_site" "${H[@]}" -H "Content-Type: application/json" -d "{\"p_site\":\"$TSID\"}")
          left=$(curl -sS "$URL/rest/v1/sites?select=id&id=eq.$TSID" "${H[@]}" | jq 'length')
          [ -n "$TSID" ] && [ "$left" = 0 ] && rec "관리자: 현장 삭제" 1 "점검용 현장 만들고 삭제 $(echo "$dr" | jq -c .)" || rec "관리자: 현장 삭제" 0 "id=$TSID dr=$(echo "$dr" | head -c 120) left=$left"
          cat "$RUNNER_TEMP/r.json"
      - name: Publish result
        if: always()
        run: |
          git fetch origin gh-pages && git worktree add "$RUNNER_TEMP/site" origin/gh-pages
          mkdir -p "$RUNNER_TEMP/site/_ops"
          jq --arg at "$(date -u +%FT%TZ)" '{at:$at, checks:.}' "$RUNNER_TEMP/r.json" > "$RUNNER_TEMP/site/_ops/verify.json"
          cd "$RUNNER_TEMP/site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "verify: live checks" && git push origin HEAD:gh-pages || true
