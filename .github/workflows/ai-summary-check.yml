# 실제 사이트에서 대표 계정으로 검색창에 일반 질문을 한 번 해 본다 (비밀번호 없이 일회용 로그인)
# 결과는 gh-pages 브랜치의 _ops/ai-check.json (성공 여부·줄 수·출처 수·모델만, 답 내용은 남기지 않음)
name: ai-summary-check
on:
  push:
    branches: [claude/pouch-design-handdrawn-CSzwC]
    paths: [report-system/supabase/ai-check-request.txt]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SITE: https://photolee0220-cpu.github.io/photolee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser
        working-directory: ${{ runner.temp }}
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: CEO session
        continue-on-error: true
        run: |
          cfg=$(curl -sS "$SITE/config.js?$(date +%s)")
          URL=$(echo "$cfg" | grep -o "https://[a-z0-9]*\.supabase\.co")
          ANON=$(echo "$cfg" | grep -o "supabaseAnonKey: '[^']*'" | sed "s/supabaseAnonKey: '//;s/'//")
          REF=$(echo "$URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')
          SRV=$(curl -sS "https://api.supabase.com/v1/projects/$REF/api-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[] | select(.name == "service_role") | .api_key')
          echo "::add-mask::$ANON"; echo "::add-mask::$SRV"
          # 아이디가 바뀌었을 수 있어 대표 계정의 실제 로그인 이메일을 서버에서 찾는다
          CEO=$(curl -sS "$URL/rest/v1/members?select=id&is_ceo=eq.true&active=eq.true&limit=1" -H "apikey: $SRV" -H "Authorization: Bearer $SRV" | jq -r '.[0].id // empty')
          EMAIL=$(curl -sS "$URL/auth/v1/admin/users/$CEO" -H "apikey: $SRV" -H "Authorization: Bearer $SRV" | jq -r '.email // empty')
          echo "ceo found: $([ -n "$CEO" ] && echo yes || echo no), email found: $([ -n "$EMAIL" ] && echo yes || echo no)" | tee "$RUNNER_TEMP/diag.txt"
          link=$(curl -sS -X POST "$URL/auth/v1/admin/generate_link" -H "apikey: $SRV" -H "Authorization: Bearer $SRV" -H "Content-Type: application/json" \
            -d "$(jq -n --arg e "$EMAIL" '{type:"magiclink", email:$e}')")
          TH=$(echo "$link" | jq -r '.hashed_token // .properties.hashed_token // empty')
          [ -n "$TH" ] || echo "link error: $(echo "$link" | jq -c '{code,error_code,msg}' 2>/dev/null)" | tee -a "$RUNNER_TEMP/diag.txt"
          curl -sS -X POST "$URL/auth/v1/verify" -H "apikey: $ANON" -H "Content-Type: application/json" -d "$(jq -n --arg t "$TH" '{type:"magiclink", token_hash:$t}')" \
            | jq 'if .expires_in then . + {expires_at: ((now | floor) + .expires_in)} else . end' > "$RUNNER_TEMP/session.json"
          echo "::add-mask::$(jq -r .access_token "$RUNNER_TEMP/session.json")"
          echo "::add-mask::$(jq -r .refresh_token "$RUNNER_TEMP/session.json")"
          echo "REF=$REF" >> "$GITHUB_ENV"
          if jq -e '.access_token' "$RUNNER_TEMP/session.json" >/dev/null; then echo "session ok"; else echo "session failed: $(jq -c '{code,error_code,msg}' "$RUNNER_TEMP/session.json")"; fi
      - name: Ask a question in the site
        working-directory: ${{ runner.temp }}
        run: |
          cat > check.cjs <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const out = { at: new Date().toISOString(), ok: false };
          (async () => {
            const session = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/session.json', 'utf8'));
            if (!session.access_token) {
              let diag = '';
              try { diag = fs.readFileSync(process.env.RUNNER_TEMP + '/diag.txt', 'utf8').trim(); } catch {}
              out.error = `대표 계정 일회용 로그인 실패 (${diag}; ${JSON.stringify({ code: session.code, error_code: session.error_code, msg: session.msg })})`;
              return;
            }
            const b = await chromium.launch();
            const ctx = await b.newContext({ viewport: { width: 1360, height: 900 } });
            await ctx.addInitScript(([k, v]) => localStorage.setItem(k, v), [`sb-${process.env.REF}-auth-token`, JSON.stringify(session)]);
            const p = await ctx.newPage();
            const errors = [];
            p.on('pageerror', (e) => errors.push(e.message));
            await p.goto(process.env.SITE + '/', { waitUntil: 'networkidle' });
            await p.waitForTimeout(2000);
            if (await p.getByText(/새 비밀번호/).count()) { out.error = '대표 계정이 아직 첫 비밀번호 변경 전이라 화면에 들어갈 수 없음'; await b.close(); return; }
            // 알림 필수 안내: 헤드리스 브라우저는 알림을 켤 수 없으므로 거절 후 넘어간다 (구독은 만들지 않음)
            if (await p.getByText('알림을 켜 주세요').count()) {
              await p.getByRole('button', { name: '알림 켜기' }).click().catch(() => {});
              await p.waitForTimeout(1500);
              await p.getByRole('button', { name: /지금은 넘어가기/ }).click().catch(() => {});
              out.notifyGate = 'shown, skipped';
            }
            await p.locator('#ask-input').waitFor({ timeout: 30000 });
            await p.fill('#ask-input', '이번 주 이슈 있는 현장 알려줘');
            await p.getByRole('button', { name: '묻기' }).click();
            const t0 = Date.now();
            for (;;) {
              await p.waitForTimeout(2000);
              const busy = await p.getByText(/답을 정리하는 중/).count();
              if ((!busy && Date.now() - t0 > 3000) || Date.now() - t0 > 180000) break;
            }
            out.seconds = Math.round((Date.now() - t0) / 1000);
            const ai = p.locator('section', { has: p.getByRole('heading', { name: 'AI 답변' }) }).first();
            out.answerLines = await ai.locator('div.space-y-1 > p').count();
            out.refs = await ai.locator('button', { hasText: /^S\d+$/ }).count();
            out.sources = await ai.locator('ul li').count();
            const meta = await ai.getByText(/Claude (Haiku|Sonnet|Opus)[^·]*·/).first().textContent().catch(() => null);
            out.model = meta ? meta.split('·')[0].trim() : null;
            out.used = meta ? (meta.match(/보고 \d+건 중 \d+건/) ?? [null])[0] : null;
            if (!out.answerLines) out.message = ((await ai.innerText().catch(() => '')) || '').replace(/\s+/g, ' ').slice(0, 160);
            out.matches = Number(((await p.getByText(/관련 보고 원문/).first().innerText().catch(() => '')).match(/(\d+)건/) ?? [0, 0])[1]);
            out.ok = out.answerLines > 0 && out.refs > 0 && !!out.model;
            out.pageErrors = errors.slice(0, 3);
            await b.close();
          })().catch((e) => { out.error = String(e).slice(0, 300); }).finally(() => {
            fs.writeFileSync(process.env.RUNNER_TEMP + '/ai-check.json', JSON.stringify(out, null, 2));
            console.log(JSON.stringify(out));
          });
          EOF
          node check.cjs
      - name: Publish result
        if: always()
        run: |
          git fetch origin gh-pages && git worktree add "$RUNNER_TEMP/site" origin/gh-pages
          mkdir -p "$RUNNER_TEMP/site/_ops"
          cp "$RUNNER_TEMP/ai-check.json" "$RUNNER_TEMP/site/_ops/ai-check.json" 2>/dev/null || echo '{"ok":false,"error":"no result"}' > "$RUNNER_TEMP/site/_ops/ai-check.json"
          cd "$RUNNER_TEMP/site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "ai question check" && git push origin HEAD:gh-pages || true
